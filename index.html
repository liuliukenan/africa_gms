<!doctype html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="/favicon.ico" />
  <script>
    (function () {
      var metaEl = document.createElement('meta');
      metaEl.setAttribute('name', 'viewport');
      var responsive = true;
      try {
        responsive = JSON.parse(localStorage.getItem('theme') || '{}').responsive;
      } catch (e) {
        console.error(e);
      }
      if (responsive === false) {
        metaEl.setAttribute('content', 'width=1200, initial-scale=1.0');
      } else {
        metaEl.setAttribute('content', 'width=device-width, initial-scale=1.0');
        document.documentElement.style.overflowX = 'hidden';
      }
      document.head.appendChild(metaEl);
      if (navigator.userAgent.includes('WebKit')) {
        document.documentElement.classList.add('is-webkit');
      }
    })();
  </script>
  <title>GMS</title>
  <style>
    .ele-admin-loading {
      width: 28px;
      height: 28px;
      display: grid;
      grid-gap: 8px;
      grid-template-rows: repeat(2, 1fr);
      grid-template-columns: repeat(2, 1fr);
      transform: rotate(45deg);
      animation: loadingRotate 1.2s infinite linear;
      position: fixed;
      top: calc(50% - 14px);
      left: calc(50% - 14px);
    }

    .ele-admin-loading>i {
      border-radius: 50%;
      background: #1677ff;
    }

    .ele-admin-loading>i:nth-child(2) {
      opacity: 0.7;
    }

    .ele-admin-loading>i:nth-child(3) {
      opacity: 0.5;
    }

    .ele-admin-loading>i:nth-child(4) {
      opacity: 0.3;
    }

    @keyframes loadingRotate {
      to {
        transform: rotate(405deg);
      }
    }

    .lang-box {
      position: absolute;
      top: -5px;
      right: 100px;
      width: 300px;
      z-index: 9999999999;
      height: 40px;
      /* display: flex;
      justify-content: space-between; */
    }

    .translate_switch {
      position: absolute;
      right: 241px;
      top: 3px;
      z-index: 9999999999;

    }
    @media screen and (max-width: 678px) {
      .translate_switch {
        right: 120px;
      }
    }

    .translate_switch a {
      text-decoration: none;
      color: black;
    }

    .translate_switch li {
      display: inline;
      padding-right: 4px;
    }

    .translate_switch .english:after {
      content: 'English';
    }

    .translate_switch .chinese:after {
      content: '中文'
    }

    .translate_switch .thai:after {
      content: 'ภาษาไทย'
    }

    /* 点击高亮样式 */
    .translate_switch a.active {
      color: #1677ff;
      font-weight: bold;
      background-color: #e6f7ff;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
